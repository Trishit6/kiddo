packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. These need theirs to run:
# esbuild (tsx/Vite/Vitest), msgpackr-extract (BullMQ), simple-git-hooks (hook install).
allowBuilds:
  '@parcel/watcher': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/react-query@5.108.0'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - lucide-react@1.75.0
  - vitest@5.1.1
